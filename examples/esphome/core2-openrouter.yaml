substitutions:
  device_name: m5core2openrouter
  upper_device_name: M5Core2OpenRouter


esphome:
  name: $device_name
  platformio_options:
    upload_speed: 460800
  on_boot:
    then:
      bm8563.read_time:

esp32:
  variant: esp32
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

globals:
  - id: autonomous_mode
    type: bool
    restore_value: true
    initial_value: "true"
  - id: mpu6886_temp_last_valid
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: mpu6886_temp_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

packages:
  # bluetooth: !include common/bluetooth.yaml
  common: !include common/common.yaml
  # esp_cam_status_led: !include common/esp_cam_status_led.yaml
  # esp_cam_web: !include common/esp_cam_web.yaml
  restart: !include common/restart.yaml
  # syslog: !include common/syslog.yaml
  time: !include common/time.yaml
  uptime: !include common/uptime.yaml
  version: !include common/version.yaml
  web_server: !include common/web_server.yaml
  wifi: !include common/wifi.yaml
  wifi_signal: !include common/wifi_signal.yaml

external_components:
  - source: 
      type: git
      url: https://github.com/pastukhov/esphome-axp192
      ref: master
    components: [axp192]
  - source:
      type: git
      url: https://github.com/pastukhov/openrouter_client
      ref: main
    components: [openrouter]


sensor:
  - platform: axp192
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp192_id
    update_interval: 5s
    battery_level:
      name: "${upper_device_name} Battery Level"
      id: "${device_name}_batterylevel"
    battery_voltage:
      name: "${upper_device_name} Battery Voltage"
      id: "${device_name}_battery_voltage"
    battery_charge_current:
      name: "${upper_device_name} Battery Charge Current"
      id: "${device_name}_battery_charge_current"
    battery_discharge_current:
      name: "${upper_device_name} Battery Discharge Current"
      id: "${device_name}_battery_discharge_current"
    battery_power:
      name: "${upper_device_name} Battery Power"
      id: "${device_name}_battery_power"
    vbus_voltage:
      name: "${upper_device_name} VBUS Voltage"
      id: "${device_name}_vbus_voltage"
    vbus_current:
      name: "${upper_device_name} VBUS Current"
      id: "${device_name}_vbus_current"
    vin_voltage:
      name: "${upper_device_name} VIN Voltage"
      id: "${device_name}_vin_voltage"
    vin_current:
      name: "${upper_device_name} VIN Current"
      id: "${device_name}_vin_current"
    aps_voltage:
      name: "${upper_device_name} APS Voltage"
      id: "${device_name}_aps_voltage"
    pmu_temperature:
      name: "${upper_device_name} PMU Temperature"
      id: "${device_name}_pmu_temperature"
    coulomb_in:
      name: "${upper_device_name} Coulomb In"
      id: "${device_name}_coulomb_in"
    coulomb_out:
      name: "${upper_device_name} Coulomb Out"
      id: "${device_name}_coulomb_out"
    coulomb_delta:
      name: "${upper_device_name} Coulomb Delta"
      id: "${device_name}_coulomb_delta"

  - platform: mpu6886
    address: 0x68
    update_interval: 2s
    accel_x:
      name: "MPU6886 Accel X"
      id: mpu6886_accel_x
    accel_y:
      name: "MPU6886 Accel Y"
      id: mpu6886_accel_y
    accel_z:
      name: "MPU6886 Accel Z"
      id: mpu6886_accel_z
    gyro_x:
      name: "MPU6886 Gyro X"
      id: mpu6886_gyro_x
    gyro_y:
      name: "MPU6886 Gyro Y"
      id: mpu6886_gyro_y
    gyro_z:
      name: "MPU6886 Gyro Z"
      id: mpu6886_gyro_z
    temperature:
      name: "MPU6886 Temperature (Raw)"
      id: mpu6886_temperature_raw
      internal: true

  - platform: template
    name: "MPU6886 Temperature"
    id: mpu6886_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 2s
    lambda: |-
      return id(mpu6886_temperature_raw).state;
    filters:
      - lambda: |-
          uint32_t now_ms = millis();
          // Ignore MPU temperature during boot warm-up.
          if (now_ms < 60000) {
            return {};
          }
          if (isnan(x)) {
            return {};
          }
          // Reject physically implausible/outlier values for this enclosure.
          if (x < 20.0f || x > 50.0f) {
            return {};
          }
          if (!isnan(id(mpu6886_temp_last_valid)) && id(mpu6886_temp_last_ms) != 0) {
            float dt_s = (now_ms - id(mpu6886_temp_last_ms)) / 1000.0f;
            if (dt_s < 0.1f) {
              dt_s = 0.1f;
            }
            // Limit speed of change to avoid I2C glitches leaking into telemetry.
            const float max_rate_c_per_s = 0.15f;
            float max_jump = max_rate_c_per_s * dt_s;
            if (max_jump < 0.3f) {
              max_jump = 0.3f;
            }
            if (fabsf(x - id(mpu6886_temp_last_valid)) > max_jump) {
              return {};
            }
          }
          id(mpu6886_temp_last_valid) = x;
          id(mpu6886_temp_last_ms) = now_ms;
          return x;
      - median:
          window_size: 15
          send_every: 5
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      - throttle_average: 20s
      - heartbeat: 30s

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

i2s_audio:
  - id: bus_i2s
    i2s_lrclk_pin: GPIO0
    i2s_bclk_pin: GPIO12

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 20
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12

display:
  - platform: ili9xxx
    model: ili9342
    cs_pin: GPIO5
    dc_pin: GPIO15
    invert_colors: true
    update_interval: 1s
    dimensions:
      width: 320
      height: 240
    transform:
      mirror_x: false # must be explicitly included, otherwise it defaults to true with the ili9342
    lambda: |-
      it.fill(Color(0, 0, 0));
      const uint32_t page = (millis() / 7000UL) % 3UL;
      std::string mode = id(autonomous_mode) ? "AUTO" : "MAN";
      std::string status = id(agent_status).state.empty() ? "boot" : id(agent_status).state;
      if (status.size() > 10) {
        status = status.substr(0, 10);
      }

      it.printf(6, 4, id(font_small), Color(90, 210, 255), "S%u/3", (unsigned) (page + 1));
      it.printf(50, 4, id(font_small), Color(180, 180, 180), "%s %s", mode.c_str(), status.c_str());

      int y = 22;
      const int lh = 14;
      auto print_f = [&](const char *label, float value, const char *unit, Color color, int precision) {
        if (isnan(value)) {
          it.printf(6, y, id(font_small), color, "%s:--%s", label, unit);
        } else {
          it.printf(6, y, id(font_small), color, "%s:%.*f%s", label, precision, value, unit);
        }
        y += lh;
      };
      auto print_b = [&](const char *label, bool value, Color color) {
        it.printf(6, y, id(font_small), color, "%s:%s", label, value ? "ON" : "OFF");
        y += lh;
      };

      if (page == 0) {
        print_f("MPUT", id(mpu6886_temperature).state, "C", Color(245, 245, 245), 1);
        print_f("MRAW", id(mpu6886_temperature_raw).state, "C", Color(170, 170, 170), 1);
        print_f("WF", id(${device_name}_wifi_signal).state, "dBm", Color(245, 245, 245), 0);
        print_f("UP", id(${device_name}_uptime).state, "d", Color(170, 170, 170), 1);
        print_f("BL", id(${device_name}_batterylevel).state, "%", Color(130, 255, 130), 0);
        print_f("BV", id(${device_name}_battery_voltage).state, "V", Color(130, 255, 130), 2);
        print_f("PT", id(${device_name}_pmu_temperature).state, "C", Color(255, 220, 120), 1);
        print_b("Charging", id(${device_name}_charging).state, Color(130, 255, 130));
        print_b("VBUS", id(${device_name}_vbus_present).state, Color(130, 255, 130));
        print_b("Battery", id(${device_name}_battery_present).state, Color(130, 255, 130));
        print_b("Warning", id(${device_name}_pmu_warning).state, Color(255, 140, 140));
      } else if (page == 1) {
        print_f("BCI", id(${device_name}_battery_charge_current).state, "A", Color(130, 255, 130), 2);
        print_f("BDI", id(${device_name}_battery_discharge_current).state, "A", Color(130, 255, 130), 2);
        print_f("BPW", id(${device_name}_battery_power).state, "W", Color(130, 255, 130), 2);
        print_f("VBV", id(${device_name}_vbus_voltage).state, "V", Color(170, 220, 255), 2);
        print_f("VBI", id(${device_name}_vbus_current).state, "A", Color(170, 220, 255), 2);
        print_f("VIV", id(${device_name}_vin_voltage).state, "V", Color(170, 220, 255), 2);
        print_f("VII", id(${device_name}_vin_current).state, "A", Color(170, 220, 255), 2);
        print_f("APS", id(${device_name}_aps_voltage).state, "V", Color(170, 220, 255), 2);
        print_f("CIN", id(${device_name}_coulomb_in).state, "mAh", Color(255, 220, 120), 1);
        print_f("COUT", id(${device_name}_coulomb_out).state, "mAh", Color(255, 220, 120), 1);
        print_f("CD", id(${device_name}_coulomb_delta).state, "mAh", Color(255, 220, 120), 1);
      } else {
        print_f("AX", id(mpu6886_accel_x).state, "m/s2", Color(170, 220, 255), 2);
        print_f("AY", id(mpu6886_accel_y).state, "m/s2", Color(170, 220, 255), 2);
        print_f("AZ", id(mpu6886_accel_z).state, "m/s2", Color(170, 220, 255), 2);
        print_f("GX", id(mpu6886_gyro_x).state, "d/s", Color(255, 220, 120), 1);
        print_f("GY", id(mpu6886_gyro_y).state, "d/s", Color(255, 220, 120), 1);
        print_f("GZ", id(mpu6886_gyro_z).state, "d/s", Color(255, 220, 120), 1);

        std::string resp = id(agent_last_response).state;
        for (auto &ch : resp) {
          if (ch == '\n' || ch == '\r' || ch == '\t') {
            ch = ' ';
          }
        }
        if (resp.size() > 34) {
          resp = resp.substr(0, 34) + "...";
        }
        it.printf(6, y + 4, id(font_small), Color(130, 255, 130), "AI: %s", resp.c_str());
      }

touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39

speaker:
  - platform: i2s_audio
    id: core2_speaker
    dac_type: external
    i2s_audio_id: bus_i2s
    i2s_dout_pin: GPIO2
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    timeout: never

microphone:
  - platform: i2s_audio
    id: core2_microphone
    adc_type: external
    i2s_audio_id: bus_i2s
    i2s_din_pin: GPIO34
    pdm: true
    channel: right
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true

binary_sensor:
  # the virtual buttons--coordinates taken from
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/M5Core2.h#L54-L56
  # and
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/utility/M5Button.h#L811-L815
  # for the parameter order `(x, y, width, height)`
  - platform: touchscreen
    name: Button A
    id: button_a
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: agent_tick

  - platform: touchscreen
    name: Button B
    id: button_b
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - switch.toggle: agent_autonomous_mode

  - platform: touchscreen
    name: Button C
    id: button_c
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - openrouter.ask:
          prompt: "Summarize home state in one sentence."

  - platform: axp192
    axp192_id: axp192_id
    charging:
      name: "${upper_device_name} Charging"
      id: "${device_name}_charging"
    vbus_present:
      name: "${upper_device_name} VBUS Present"
      id: "${device_name}_vbus_present"
    battery_present:
      name: "${upper_device_name} Battery Present"
      id: "${device_name}_battery_present"
    warning_level:
      name: "${upper_device_name} PMU Warning"
      id: "${device_name}_pmu_warning"
