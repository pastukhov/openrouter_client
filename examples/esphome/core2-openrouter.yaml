time:
  - platform: bm8563
    update_interval: never
  - platform: homeassistant
    on_time_sync:
      then:
        bm8563.write_time:

openrouter:
  id: ai_agent
  api_key: !secret openrouter_api_key
  model: "openai/gpt-4o-mini"
  temperature: 0.3
  max_tokens: 120
  system_role: "You are an on-device smart-home agent. Reply in plain text only (no markdown, no lists), concise, one actionable recommendation, max 160 characters."
  enable_streaming: false
  http_timeout: 30s
  response_buffer_size: 4096
  on_response:
    - logger.log:
        format: "AI Response: %s"
        args: ['response.c_str()']
    - text_sensor.template.publish:
        id: agent_last_response
        state: !lambda "return response;"
    - text_sensor.template.publish:
        id: agent_status
        state: "idle"
    - homeassistant.event:
        event: esphome.openrouter_response
        data:
          response: !lambda 'return response;'
  on_error:
    - logger.log:
        format: "AI Error: %s"
        args: ['error.c_str()']
        level: ERROR
    - text_sensor.template.publish:
        id: agent_status
        state: "error"

text_sensor:
  - platform: openrouter
    name: "AI Response"
    id: ai_response

  - platform: template
    name: "Agent Last Response"
    id: agent_last_response

  - platform: template
    name: "Agent Status"
    id: agent_status
    update_interval: never

script:
  - id: agent_tick
    mode: queued
    then:
      - text_sensor.template.publish:
          id: agent_status
          state: "thinking"
      - openrouter.ask:
          prompt: !lambda |-
            std::string prompt = "Goal: Keep comfort stable and recommend one micro-action.";
            prompt += "\nContext:";
            prompt += "\n- mpu_temp_c=" + to_string(id(mpu6886_temperature).state);
            prompt += "\n- wifi_dbm=" + to_string(id(${device_name}_wifi_signal).state);
            prompt += "\nOutput format: plain text only, no markdown, max 160 chars, single recommendation.";
            return prompt;

button:
  - platform: template
    name: "Ask AI"
    on_press:
      - script.execute: agent_tick

switch:
  - platform: template
    name: "Agent Autonomous Mode"
    id: agent_autonomous_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: "id(autonomous_mode) = true;"
      - text_sensor.template.publish:
          id: agent_status
          state: "auto:on"
    turn_off_action:
      - lambda: "id(autonomous_mode) = false;"
      - text_sensor.template.publish:
          id: agent_status
          state: "auto:off"

interval:
  - interval: 5min
    then:
      - if:
          condition:
            lambda: "return id(autonomous_mode);"
          then:
            - script.execute: agent_tick
