substitutions:
  device_name: m5core2openrouter
  upper_device_name: M5Core2OpenRouter


esphome:
  name: $device_name
  platformio_options:
    upload_speed: 460800
  on_boot:
    then:
      bm8563.read_time:

esp32:
  variant: esp32
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

globals:
  - id: autonomous_mode
    type: bool
    restore_value: true
    initial_value: "true"
  - id: mpu6886_temp_last_valid
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: mpu6886_temp_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

packages:
  # bluetooth: !include common/bluetooth.yaml
  common: !include common/common.yaml
  # esp_cam_status_led: !include common/esp_cam_status_led.yaml
  # esp_cam_web: !include common/esp_cam_web.yaml
  restart: !include common/restart.yaml
  # syslog: !include common/syslog.yaml
  time: !include common/time.yaml
  uptime: !include common/uptime.yaml
  version: !include common/version.yaml
  web_server: !include common/web_server.yaml
  wifi: !include common/wifi.yaml
  wifi_signal: !include common/wifi_signal.yaml

external_components:
  - source: 
      type: git
      url: https://github.com/makerwolf/esphome-axp192
      ref: esp-idf-compatibility
    components: [axp192]
  - source:
      type: git
      url: https://github.com/pastukhov/openrouter_client
      ref: main
    components: [openrouter]


sensor:
  - platform: axp192
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp192_id
    update_interval: 30s
    battery_level:
      name: "${upper_device_name} Battery Level"
      id: "${device_name}_batterylevel"

  - platform: mpu6886
    address: 0x68
    update_interval: 2s
    accel_x:
      name: "MPU6886 Accel X"
    accel_y:
      name: "MPU6886 Accel Y"
    accel_z:
      name: "MPU6886 Accel Z"
    gyro_x:
      name: "MPU6886 Gyro X"
    gyro_y:
      name: "MPU6886 Gyro Y"
    gyro_z:
      name: "MPU6886 Gyro Z"
    temperature:
      name: "MPU6886 Temperature (Raw)"
      id: mpu6886_temperature_raw
      internal: true

  - platform: template
    name: "MPU6886 Temperature"
    id: mpu6886_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 2s
    lambda: |-
      return id(mpu6886_temperature_raw).state;
    filters:
      - lambda: |-
          uint32_t now_ms = millis();
          // Ignore MPU temperature during boot warm-up.
          if (now_ms < 60000) {
            return {};
          }
          if (isnan(x)) {
            return {};
          }
          // Reject physically implausible/outlier values for this enclosure.
          if (x < 20.0f || x > 50.0f) {
            return {};
          }
          if (!isnan(id(mpu6886_temp_last_valid)) && id(mpu6886_temp_last_ms) != 0) {
            float dt_s = (now_ms - id(mpu6886_temp_last_ms)) / 1000.0f;
            if (dt_s < 0.1f) {
              dt_s = 0.1f;
            }
            // Limit speed of change to avoid I2C glitches leaking into telemetry.
            const float max_rate_c_per_s = 0.15f;
            float max_jump = max_rate_c_per_s * dt_s;
            if (max_jump < 0.3f) {
              max_jump = 0.3f;
            }
            if (fabsf(x - id(mpu6886_temp_last_valid)) > max_jump) {
              return {};
            }
          }
          id(mpu6886_temp_last_valid) = x;
          id(mpu6886_temp_last_ms) = now_ms;
          return x;
      - median:
          window_size: 15
          send_every: 5
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      - throttle_average: 20s
      - heartbeat: 30s

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 20
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12

display:
  - platform: ili9xxx
    model: ili9342
    cs_pin: GPIO5
    dc_pin: GPIO15
    invert_colors: true
    update_interval: 1s
    dimensions:
      width: 320
      height: 240
    transform:
      mirror_x: false # must be explicitly included, otherwise it defaults to true with the ili9342
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.printf(8, 6, id(font_header), Color(90, 210, 255), "OpenRouter Agent");

      std::string mode = id(autonomous_mode) ? "AUTO" : "MANUAL";
      std::string status = id(agent_status).state.empty() ? "boot" : id(agent_status).state;
      it.printf(8, 34, id(font_small), Color(180, 180, 180), "%s | %s", mode.c_str(), status.c_str());
      it.printf(8, 50, id(font_small), Color(245, 245, 245), "T:%.1fC  WiFi:%.0fdBm", id(mpu6886_temperature).state, id(${device_name}_wifi_signal).state);
      it.printf(8, 66, id(font_small), Color(255, 220, 120), "A:Run  B:Auto  C:Quick");

      std::string response = id(agent_last_response).state;
      if (response.empty()) {
        response = "No response yet.";
      }

      // Normalize whitespace from model output for stable on-screen rendering.
      for (auto &ch : response) {
        if (ch == '\n' || ch == '\r' || ch == '\t') {
          ch = ' ';
        }
      }
      std::string compact;
      compact.reserve(response.size());
      bool prev_space = false;
      for (char ch : response) {
        bool is_space = (ch == ' ');
        if (is_space && prev_space) {
          continue;
        }
        compact.push_back(ch);
        prev_space = is_space;
      }

      const int response_x = 8;
      const int response_y = 84;
      const int line_height = 13;
      const int max_lines = 11;
      const size_t max_chars_per_line = 34;

      size_t start = 0;
      int line_index = 0;
      while (start < compact.size() && line_index < max_lines) {
        size_t end = start + max_chars_per_line;
        if (end > compact.size()) {
          end = compact.size();
        }

        size_t split = end;
        if (end < compact.size()) {
          size_t space_pos = compact.rfind(' ', end - 1);
          if (space_pos != std::string::npos && space_pos > start + 10) {
            split = space_pos;
          }
        }

        std::string part = compact.substr(start, split - start);
        while (!part.empty() && part.front() == ' ') {
          part.erase(part.begin());
        }
        while (!part.empty() && part.back() == ' ') {
          part.pop_back();
        }
        if (part.empty()) {
          start = (split == start) ? start + 1 : split + 1;
          continue;
        }

        if (line_index == max_lines - 1 && split < compact.size()) {
          if (part.size() > max_chars_per_line - 3) {
            part = part.substr(0, max_chars_per_line - 3);
          }
          part += "...";
        }

        it.print(response_x, response_y + line_index * line_height, id(font_small), Color(130, 255, 130), part.c_str());
        line_index++;
        start = (split < compact.size() && compact[split] == ' ') ? split + 1 : split;
      }

touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39

binary_sensor:
  # the virtual buttons--coordinates taken from
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/M5Core2.h#L54-L56
  # and
  # https://github.com/m5stack/M5Core2/blob/0134dd3a38cfd335a1ec39da2c149f88baf54326/src/utility/M5Button.h#L811-L815
  # for the parameter order `(x, y, width, height)`
  - platform: touchscreen
    name: Button A
    id: button_a
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: agent_tick

  - platform: touchscreen
    name: Button B
    id: button_b
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - switch.toggle: agent_autonomous_mode

  - platform: touchscreen
    name: Button C
    id: button_c
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - openrouter.ask:
          prompt: "Summarize home state in one sentence."
