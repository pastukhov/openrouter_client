esphome:
  name: openrouter-example
  friendly_name: OpenRouter Example

external_components:
  - source:
      type: local
      path: ../../components

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "OpenRouter-Example"
    password: "fallback123"

captive_portal:

# OpenRouter component configuration
openrouter:
  api_key: !secret openrouter_api_key
  model: "openai/gpt-4o-mini"
  temperature: 0.7
  max_tokens: 512
  system_role: "You are a helpful assistant for a smart home. Keep responses brief and concise."
  enable_streaming: false
  http_timeout: 30s
  response_buffer_size: 4096
  on_response:
    - logger.log:
        format: "AI Response: %s"
        args: ['response.c_str()']
    - homeassistant.event:
        event: esphome.openrouter_response
        data:
          response: !lambda 'return response;'
  on_error:
    - logger.log:
        format: "AI Error: %s"
        args: ['error.c_str()']
        level: ERROR

# Text sensor to expose AI response to Home Assistant
text_sensor:
  - platform: openrouter
    name: "AI Response"
    id: ai_response

# Example buttons to interact with AI
button:
  - platform: template
    name: "Ask About Weather"
    on_press:
      - openrouter.ask:
          prompt: "What's the best way to check the weather on a smart home display?"

  - platform: template
    name: "Ask About Lights"
    on_press:
      - openrouter.ask:
          prompt: "Suggest an optimal lighting schedule for energy saving."

  - platform: template
    name: "Custom AI Question"
    on_press:
      - openrouter.ask:
          prompt: !lambda |-
            return "The current temperature is " +
                   to_string(id(temperature_sensor).state) +
                   "°C. Is this comfortable for sleeping?";

# Example: Change model dynamically
switch:
  - platform: template
    name: "Use GPT-4"
    optimistic: true
    turn_on_action:
      - openrouter.set_model:
          model: "openai/gpt-4o"
    turn_off_action:
      - openrouter.set_model:
          model: "openai/gpt-4o-mini"

# Example sensor for dynamic prompts
sensor:
  - platform: template
    name: "Temperature"
    id: temperature_sensor
    unit_of_measurement: "°C"
    lambda: |-
      return 22.5;  // Replace with actual sensor
